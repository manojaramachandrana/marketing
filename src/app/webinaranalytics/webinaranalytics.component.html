<div class="date-range-filter">
    <mat-form-field appearance="fill" class="date-range-field">
      <mat-label>Date Range</mat-label>
      <mat-date-range-input [rangePicker]="datePicker" [formGroup]="dateRangeForm">
        <input matStartDate formControlName="start" placeholder="Start date">
        <input matEndDate formControlName="end" placeholder="End date">
      </mat-date-range-input>
      <mat-datepicker-toggle matSuffix [for]="datePicker"></mat-datepicker-toggle>
      <mat-date-range-picker #datePicker></mat-date-range-picker>
    </mat-form-field>
  
    <button mat-raised-button color="primary" (click)="onDateRangeChange()">Apply Filter</button>
  </div>

  <br>
  

  <div class="table-container">
    <!-- <h3>Webinar Analytics</h3> -->
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <ng-container matColumnDef="event">
        <th mat-header-cell *matHeaderCellDef> Webinar Door </th>
        <td mat-cell *matCellDef="let element"> {{ element.event }} </td>
      </ng-container>
  
      <ng-container matColumnDef="count">
        <th mat-header-cell *matHeaderCellDef> Registration </th>
        <td mat-cell *matCellDef="let element" (click)="openLeadDialog('lead', element)"> {{ element.count }} </td>
      </ng-container>

      <ng-container matColumnDef="30mins">
        <th mat-header-cell *matHeaderCellDef>Watched <br> 30 Mins </th>
        <td mat-cell *matCellDef="let element" (click)="openLeadDialog('30mins', element)"> {{element['duration30']}} </td>
      </ng-container>

      <ng-container matColumnDef="40mins">
        <th mat-header-cell *matHeaderCellDef>Watched <br> 40 Mins </th>
        <td mat-cell *matCellDef="let element" (click)="openLeadDialog('40mins', element)"> {{element.duration40}} </td>
      </ng-container>

      <ng-container matColumnDef="60mins">
        <th mat-header-cell *matHeaderCellDef>Watched <br> 60 Mins </th>
        <td mat-cell *matCellDef="let element" (click)="openLeadDialog('60mins', element)"> {{element.duration60}} </td>
      </ng-container>

      <ng-container matColumnDef="applied">
        <th mat-header-cell *matHeaderCellDef> Applied </th>
        <td mat-cell *matCellDef="let element" (click)="openLeadDialog('applied', element)"> {{element.applied}} </td>
      </ng-container>

      <ng-container matColumnDef="sale">
        <th mat-header-cell *matHeaderCellDef> Sales </th>
        <td mat-cell *matCellDef="let element" (click)="openLeadDialog('sale', element)"> {{element.sale}} </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
