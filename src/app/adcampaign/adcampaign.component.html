  <mat-form-field appearance="fill">
    <mat-label>Select Ad Account</mat-label>
    <mat-select [(value)]="selectedAdAccount" (selectionChange)="onAdAccountChange($event.value)">
      <mat-option *ngFor="let adaccount of allowedAdAccounts" [value]="adaccount">
        {{ adaccount }}
      </mat-option>
    </mat-select>
  </mat-form-field>
  
  <table mat-table [dataSource]="campaignData">
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef> <strong> Range</strong> </th>
      <td mat-cell *matCellDef="let campaign">
        {{ getPreviousDate(campaign) }} - {{formattedDate( campaign.date) }}
      </td>
    </ng-container>
  
    <ng-container matColumnDef="campaigns">
      <th mat-header-cell *matHeaderCellDef> <strong> Campaign </strong> </th>
      <td mat-cell *matCellDef="let campaign">
        <ul>
          <li *ngFor="let item of campaign.campaigns">
            {{ item.name }}
          </li>
        </ul>
      </td>
    </ng-container>
  
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
